sonar.projectKey=laravel-app
sonar.projectName=Laravel App
sonar.sourceEncoding=UTF-8

sonar.sources=app,routes,resources
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,bootstrap/cache/**

# Cobertura y resultados de PHPUnit
sonar.php.coverage.reportPaths=reports/coverage.xml
sonar.php.tests.reportPath=reports/junit.xml

# Rutas, vistas y JS no se miden con pruebas unitarias de PHP
sonar.coverage.exclusions=routes/**,resources/**
